<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Confirm Email Change | Clinician Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #f8f5ef; color: #2c352d; font: 15px Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
        main { background: white; border: 1px solid #e5ded2; border-radius: 24px; box-shadow: 0 16px 40px #2030201a; max-width: 448px; padding: 32px; width: 100%; }
        header { margin-bottom: 24px; text-align: center; }
        h1, p { margin: 0 0 10px; }
        h1 { color: #263d2a; font: 600 26px Georgia, serif; }
        p { color: #626b62; line-height: 1.5; }
        button { background: #36583b; border: 0; border-radius: 10px; color: white; cursor: pointer; font: 600 14px Arial, sans-serif; margin: 12px 0; padding: 13px; width: 100%; }
        button:disabled { cursor: not-allowed; opacity: .65; }
        a { color: #36583b; display: block; margin-top: 18px; text-align: center; }
        #status { border-radius: 10px; line-height: 1.5; padding: 12px; }
        .bg-rose-50 { background: #fff1f2; color: #9f1239; }
        .bg-emerald-50 { background: #ecfdf5; color: #065f46; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-3xl border border-stone-200 shadow-xl p-7 sm:p-9 space-y-6">
        <header class="text-center space-y-2">
            <h1 class="font-serif text-2xl font-semibold text-green-950">Clinician Portal</h1>
            <p class="text-sm text-stone-600">Confirm account email update</p>
        </header>
        <div class="space-y-3">
            <p class="text-sm text-stone-600">Confirm this request to update the account email. If you did not request it, close this page; the address on file will remain unchanged.</p>
            <button id="confirm-button" type="button" class="w-full bg-green-800 hover:bg-green-900 text-white font-semibold py-3 rounded-xl">Confirm email change</button>
        </div>
        <p id="status" role="status" aria-live="polite" class="hidden rounded-xl p-3 text-sm"></p>
        <a href="admin.html" class="block text-center text-sm text-green-800 hover:underline">Return to sign in</a>
    </main>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        history.replaceState(null, '', location.pathname);
        const button = document.getElementById('confirm-button');
        const status = document.getElementById('status');
        function showStatus(message, isError = false) {
            status.textContent = message;
            status.className = `rounded-xl p-3 text-sm ${isError ? 'bg-rose-50 text-rose-800' : 'bg-emerald-50 text-emerald-800'}`;
        }
        if (!/^[a-f0-9]{64}$/i.test(token)) {
            button.disabled = true;
            showStatus('This confirmation link is invalid or expired. Request a new email change.', true);
        }
        button.addEventListener('click', async () => {
            button.disabled = true;
            try {
                const response = await fetch('/api/account/email/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Could not confirm the email change.');
                showStatus('The email change is confirmed. Account sessions were signed out; sign in using the new address.');
            } catch (error) {
                showStatus(error.message || 'Could not confirm the email change.', true);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
