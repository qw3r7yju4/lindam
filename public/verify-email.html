<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Confirm Email Change | Clinician Portal</title>
    <link rel="stylesheet" href="/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#fdfcfa] font-sans text-sage-900 antialiased selection:bg-sage-200 selection:text-sage-900 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-3xl border border-sand-200 shadow-card p-7 sm:p-9 space-y-6">
        <header class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-sage-50 text-sage-700 flex items-center justify-center mx-auto mb-2">
                <i data-lucide="mail-check" class="w-6 h-6"></i>
            </div>
            <h1 class="font-serif text-2xl font-semibold text-sage-900">Clinician Portal</h1>
            <p class="text-xs sm:text-sm text-sage-600">Confirm account email update</p>
        </header>
        <div class="space-y-4">
            <p class="text-xs sm:text-sm text-sage-600 leading-relaxed">Confirm this request to update the account email. If you did not request it, close this page; the address on file will remain unchanged.</p>
            <button id="confirm-button" type="button" class="w-full bg-sage-700 hover:bg-sage-800 text-white font-semibold py-3.5 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>Confirm email change</span>
            </button>
        </div>
        <p id="status" role="status" aria-live="polite" class="hidden rounded-xl p-3 text-xs sm:text-sm"></p>
        <div class="pt-4 border-t border-sand-200 text-center">
            <a href="admin.html" class="text-xs font-medium text-sage-700 hover:text-sage-900 hover:underline">Return to sign in</a>
        </div>
    </main>
    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        history.replaceState(null, '', location.pathname);
        const button = document.getElementById('confirm-button');
        const status = document.getElementById('status');
        function showStatus(message, isError = false) {
            status.textContent = message;
            status.className = `rounded-xl p-3 text-xs sm:text-sm font-medium ${isError ? 'bg-rose-50 text-rose-800 border border-rose-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200'}`;
            status.classList.remove('hidden');
        }
        if (!/^[a-f0-9]{64}$/i.test(token)) {
            button.disabled = true;
            showStatus('This confirmation link is invalid or expired. Request a new email change.', true);
        }
        button.addEventListener('click', async () => {
            button.disabled = true;
            try {
                const response = await fetch('/api/account/email/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Could not confirm the email change.');
                showStatus('The email change is confirmed. Account sessions were signed out; sign in using the new address.');
            } catch (error) {
                showStatus(error.message || 'Could not confirm the email change.', true);
                button.disabled = false;
            }
        });
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
